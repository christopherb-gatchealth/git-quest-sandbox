name: Secret scan

# A small stand-in for tools like gitleaks: fails a PR if any of its commits
# add something that looks like a secret. Patterns match SECRET_RE in
# .github/quest/engine/util.mjs.
on:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    # The bot's own "teammate" PRs are skipped.
    if: github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the PR's commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          export PATTERN='QUEST_SECRET_[A-Z0-9]{20}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          # Lists each commit that adds a matching line.
          found=$(git log -p --format='commit %h %s' "$BASE..$HEAD" \
            | perl -ne 'if (/^commit /) { $c = $_ } elsif (/^\+/ && /$ENV{PATTERN}/) { print $c }' | sort -u)
          if [ -n "$found" ]; then
            echo "::error::Possible secret found. These commits add one:"
            echo "$found"
            echo
            echo "Remove the secret from these commits (not just from the latest one), and rotate the key."
            exit 1
          fi
          echo "No secrets found."
