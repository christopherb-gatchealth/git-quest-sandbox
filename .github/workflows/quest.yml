name: Quest Engine

# Watches the player's pushes, PRs and comments, and runs the game.
on:
  workflow_dispatch:
    inputs:
      action:
        description: start begins the game, retry reopens a quest that failed to open, skip passes the current quest, reset wipes all progress
        type: choice
        options: [start, retry, skip, reset]
        default: start
  issue_comment:
    types: [created]
  # main is left out: merges reach the engine as the PR's "closed" event.
  push:
    branches-ignore: [main, quest-state, 'bot/**']
  pull_request:
    types: [opened, edited, synchronize, reopened, closed]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    workflows: [App CI]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  engine:
    # Skip events the game never needs (the bot's own actions, deleted
    # branches, plain comments) before they reach the queue below.
    if: >-
      github.actor != 'github-actions[bot]' &&
      !(github.event_name == 'push' && github.event.deleted) &&
      !(github.event_name == 'issue_comment' && !startsWith(github.event.comment.body, '/'))
    # One event at a time, in order, so two never edit the game state at once.
    # GitHub keeps only one waiting run per group, so the filter above matters.
    concurrency:
      group: quest-engine
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # Always run the engine as it is on main, whatever branch the event came from.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/quest
      # The runner already has Node 20 or newer.
      - run: node .github/quest/engine/main.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
