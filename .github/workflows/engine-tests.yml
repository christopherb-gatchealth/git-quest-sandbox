name: Engine tests

# Checks the quest engine itself when someone changes it.
on:
  pull_request:
    paths: ['.github/quest/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test .github/quest/engine/test/
